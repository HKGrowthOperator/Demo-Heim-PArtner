<title>Heim &amp; Partner Plattform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Produkt-UI, hell: Dennis prüft morgens im Büro am Laptop, Bauleiter erfassen vor Ort am Handy.
   Restrained: getönte Neutraltöne (Hue 200), ein Akzent Petrol für Auswahl, Links und KI. Semantik getrennt. */
:root{
  --bg:oklch(0.982 0.003 200); --panel:oklch(0.997 0.002 200); --side:oklch(0.962 0.005 200); --sunk:oklch(0.952 0.006 200);
  --line:oklch(0.905 0.006 200); --line-2:oklch(0.85 0.008 200);
  --ink:oklch(0.23 0.014 220); --ink-2:oklch(0.43 0.013 220); --ink-3:oklch(0.57 0.011 220);
  --primary:oklch(0.27 0.02 220); --on-primary:oklch(0.98 0.003 200);
  --accent:oklch(0.5 0.095 205); --accent-2:oklch(0.43 0.085 205); --accent-soft:oklch(0.95 0.025 205); --accent-line:oklch(0.83 0.05 205);
  --ok:oklch(0.52 0.12 152); --ok-soft:oklch(0.95 0.035 152);
  --warn:oklch(0.52 0.11 70); --warn-dot:oklch(0.72 0.14 75); --warn-soft:oklch(0.955 0.045 85);
  --crit:oklch(0.53 0.17 28); --crit-soft:oklch(0.955 0.03 25);
  --scrim:oklch(0.2 0.02 220 / .35);
  --shadow:0 1px 2px oklch(0.2 0.02 220 / .06),0 8px 24px -8px oklch(0.2 0.02 220 / .12);
  --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:oklch(0.175 0.008 220); --panel:oklch(0.205 0.009 220); --side:oklch(0.19 0.009 220); --sunk:oklch(0.16 0.008 220);
  --line:oklch(0.285 0.01 220); --line-2:oklch(0.35 0.012 220);
  --ink:oklch(0.94 0.005 200); --ink-2:oklch(0.77 0.01 210); --ink-3:oklch(0.63 0.01 210);
  --primary:oklch(0.92 0.01 200); --on-primary:oklch(0.2 0.01 220);
  --accent:oklch(0.74 0.09 200); --accent-2:oklch(0.8 0.08 200); --accent-soft:oklch(0.28 0.04 205); --accent-line:oklch(0.45 0.06 205);
  --ok:oklch(0.75 0.13 152); --ok-soft:oklch(0.28 0.05 152);
  --warn:oklch(0.8 0.12 80); --warn-dot:oklch(0.78 0.14 75); --warn-soft:oklch(0.3 0.05 80);
  --crit:oklch(0.72 0.15 28); --crit-soft:oklch(0.3 0.06 25);
  --scrim:oklch(0.05 0.01 220 / .55); --shadow:0 1px 2px oklch(0 0 0 / .3),0 10px 30px -10px oklch(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(0.175 0.008 220); --panel:oklch(0.205 0.009 220); --side:oklch(0.19 0.009 220); --sunk:oklch(0.16 0.008 220);
  --line:oklch(0.285 0.01 220); --line-2:oklch(0.35 0.012 220);
  --ink:oklch(0.94 0.005 200); --ink-2:oklch(0.77 0.01 210); --ink-3:oklch(0.63 0.01 210);
  --primary:oklch(0.92 0.01 200); --on-primary:oklch(0.2 0.01 220);
  --accent:oklch(0.74 0.09 200); --accent-2:oklch(0.8 0.08 200); --accent-soft:oklch(0.28 0.04 205); --accent-line:oklch(0.45 0.06 205);
  --ok:oklch(0.75 0.13 152); --ok-soft:oklch(0.28 0.05 152);
  --warn:oklch(0.8 0.12 80); --warn-dot:oklch(0.78 0.14 75); --warn-soft:oklch(0.3 0.05 80);
  --crit:oklch(0.72 0.15 28); --crit-soft:oklch(0.3 0.06 25);
  --scrim:oklch(0.05 0.01 220 / .55); --shadow:0 1px 2px oklch(0 0 0 / .3),0 10px 30px -10px oklch(0 0 0 / .5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:1.375rem}
h2{font-size:1rem}
h3{font-size:.875rem}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em;letter-spacing:-.01em}
.t2{color:var(--ink-2)} .t3{color:var(--ink-3)}
.sm{font-size:.8125rem} .xs{font-size:.75rem}
.lbl{font-size:.6875rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px}
svg.i.s{width:14px;height:14px}
svg.i.l{width:20px;height:20px}

/* Shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:12px 10px}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:700 11px var(--f);letter-spacing:-.03em}
.ws b{display:block;font-size:.8125rem;font-weight:600}
.ws span{font-size:.75rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav .grp{padding:14px 8px 4px}
.nav a{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;color:var(--ink-2);font-weight:500;font-size:.8125rem}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px oklch(0.2 0.02 220 / .05)}
.nav a:focus-visible{outline:2px solid var(--accent)}
.nav .cnt{margin-left:auto;font:500 .6875rem var(--mono);color:var(--ink-3)}
.nav .cnt.alert{color:var(--crit)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn-dot)}.dot.crit{background:var(--crit)}.dot.acc{background:var(--accent)}
.me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px 2px;border-top:1px solid var(--line)}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:.6875rem;font-weight:600;flex:none}

.top{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:12px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 20px;background:color-mix(in oklch,var(--bg) 88%,transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:.8125rem;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 8px 5px 10px;color:var(--ink-3);font-size:.8125rem;width:260px}
.search kbd{margin-left:auto;font:500 .6875rem var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--sunk)}
.iconbtn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:var(--ink-2);position:relative}
.iconbtn:hover{background:var(--sunk)}
.iconbtn .bdg{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--bg)}

.page{padding:24px max(24px,env(safe-area-inset-right,0px)) 120px max(24px,env(safe-area-inset-left,0px));max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--ink-3);font-size:.8125rem}
.ph .meta span{display:inline-flex;align-items:center;gap:5px}

/* Bausteine */
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.bh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:48px;flex-wrap:wrap}
.bh h2{font-size:.875rem}
.bb{padding:16px}
.cols{display:grid;gap:20px}
.c-2-1{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.c-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.c-side{grid-template-columns:280px minmax(0,1fr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.divide>*+*{border-top:1px solid var(--line)}

.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:.8125rem;white-space:nowrap;transition:background-color .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:color-mix(in oklch,var(--primary) 88%,var(--accent))}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-primary)}
:root[data-theme="dark"] .btn.acc{color:oklch(0.18 0.02 220)}
.btn.acc:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:26px;padding:0 9px;font-size:.75rem;border-radius:6px}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.lnk:hover{text-decoration:underline}

.st{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;color:var(--ink-2);white-space:nowrap}
.st .dot{width:6px;height:6px}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:.6875rem;font-weight:500;background:var(--sunk);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.tag.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.acc{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.ki{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:.6875rem;font-weight:600;letter-spacing:.02em}

/* Tabellen */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:.6875rem;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.8125rem}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr.sel td{background:var(--accent-soft)}
tr.hov:hover td{background:var(--sunk);cursor:pointer}
.nm{font-weight:500;color:var(--ink)}
.sub{display:block;font-size:.75rem;color:var(--ink-3)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 10px;font-size:.8125rem;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs .c{font:500 .6875rem var(--mono);color:var(--ink-3)}

/* Funnel/Ablauf */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.flow>div{padding:12px 14px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.flow>div+div{border-left:1px solid var(--line)}
.flow .v{font:600 1.25rem/1.1 var(--mono);font-variant-numeric:tabular-nums}
.flow .bar{height:3px;background:var(--sunk);border-radius:2px;margin-top:6px;overflow:hidden}
.flow .bar i{display:block;height:100%;background:var(--ink-2)}
.flow>div.now .bar i{background:var(--accent)}
.flow>div.now .v{color:var(--accent)}

/* Agenda */
.ag{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px}
.ag .ic{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;margin-top:1px}
.ag .ic.crit{background:var(--crit-soft);color:var(--crit)}.ag .ic.warn{background:var(--warn-soft);color:var(--warn)}.ag .ic.acc{background:var(--accent-soft);color:var(--accent)}.ag .ic.ok{background:var(--ok-soft);color:var(--ok)}
.ag b{font-weight:500;display:block}
.ag .why{font-size:.75rem;color:var(--ink-3);margin-top:2px}

/* QZB */
.qzb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.qzb>div{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qzb>div+div{border-left:1px solid var(--line)}
.qzb .v{font:600 1.375rem/1.15 var(--f);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:5px;border-radius:2px;background:var(--sunk)}
.meter.ok i.f{background:var(--ok)}.meter.warn i.f{background:var(--warn-dot)}.meter.crit i.f{background:var(--crit)}
.mini3{display:inline-flex;gap:3px}
.mini3 i{width:16px;height:5px;border-radius:2px;background:var(--sunk)}
.mini3 i.ok{background:var(--ok)}.mini3 i.warn{background:var(--warn-dot)}.mini3 i.crit{background:var(--crit)}

/* Gantt */
.gantt{font-size:.75rem;min-width:760px}
.g-head,.g-row{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:center}
.g-head{border-bottom:1px solid var(--line);height:28px;color:var(--ink-3)}
.g-row{height:34px;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-row .n{padding:0 12px;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.g-row .n b{font-weight:500;font-size:.78rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row .n span{color:var(--ink-3);font-size:.6875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lane{position:relative;height:100%}
.g-months{position:relative;height:100%}
.g-months span{position:absolute;top:7px;font:500 .6875rem var(--mono);padding-left:5px;border-left:1px solid var(--line);height:21px}
.g-grid{position:absolute;inset:0;pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
.g-bar{position:absolute;top:10px;height:14px;border-radius:4px;background:var(--ink-2);opacity:.85;transition:left .35s cubic-bezier(.22,1,.36,1),width .35s cubic-bezier(.22,1,.36,1)}
.g-bar.done{background:var(--line-2);opacity:1}
.g-bar.run{background:var(--accent)}
.g-bar.late{background:var(--crit)}
.g-bar.plan{background:transparent;border:1.5px dashed var(--ink-3);opacity:.9}
.g-bar.open{background:transparent;border:1.5px solid var(--accent);opacity:1;background:repeating-linear-gradient(135deg,var(--accent-soft) 0 4px,transparent 4px 8px)}
.g-ms{position:absolute;top:9px;width:14px;height:14px;transform:translateX(-7px) rotate(45deg);background:var(--ink);border-radius:2px}
.g-ms.late{background:var(--crit)}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);z-index:2}
.g-today b{position:absolute;top:-1px;left:4px;font:500 .625rem var(--mono);color:var(--accent);background:var(--panel);padding:0 3px}

/* Formulare */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:.75rem;font-weight:500;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);font-size:.8125rem;width:100%;min-width:0}
.fld textarea{height:auto;min-height:68px;padding:8px 10px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:.6875rem;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2 .full{grid-column:1/-1}

/* Stepper vertikal */
.vsteps{display:flex;flex-direction:column;gap:2px}
.vsteps button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 10px;border-radius:7px;align-items:center}
.vsteps button:hover{background:var(--sunk)}
.vsteps .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font:500 .6875rem var(--mono);color:var(--ink-3);background:var(--panel)}
.vsteps button.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.vsteps button.on .n{border-color:var(--ink);color:var(--ink)}
.vsteps button.done .n{background:var(--ink);border-color:var(--ink);color:var(--on-primary)}
.vsteps b{font-weight:500;font-size:.8125rem;display:block}
.vsteps small{font-size:.72rem;color:var(--ink-3)}

/* Bewertung */
.bar-s{display:flex;align-items:center;gap:8px;min-width:110px}
.bar-s .tr{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar-s .tr i{display:block;height:100%;border-radius:3px;background:var(--ink-2);transition:width .3s cubic-bezier(.22,1,.36,1)}
tr.sel .bar-s .tr i{background:var(--accent)}
.weights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.weights label{display:flex;flex-direction:column;gap:6px;font-size:.75rem;font-weight:500;color:var(--ink-2)}
.weights .wv{font-family:var(--mono);color:var(--ink)}
input[type=range]{accent-color:var(--accent);width:100%}
.reco{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:0;border:1px solid var(--accent-line);border-radius:10px;background:var(--panel);overflow:hidden}
.reco>div{padding:18px}
.reco>div+div{border-left:1px solid var(--accent-line);background:var(--accent-soft);display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.reco ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.reco li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:.8125rem}
.reco li svg{color:var(--ok);margin-top:2px}
.big{font:600 1.25rem/1.2 var(--f);letter-spacing:-.02em}
.scorebig{font:600 2rem/1 var(--mono);letter-spacing:-.04em}

.processing{display:flex;flex-direction:column;gap:12px;max-width:440px;margin:24px auto}
.processing div{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;color:var(--ink-3);font-size:.8125rem}
.processing div.on,.processing div.ok{color:var(--ink)}
.processing .sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2)}
.processing div.on .sp{border-color:var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.processing div.ok .sp{border:0;background:var(--ok);display:grid;place-items:center;color:var(--on-primary)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Browser-/Phone-Rahmen */
.frame{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.frame .bar{height:34px;background:var(--sunk);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px}
.frame .bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:inline-block;margin-right:4px}

     return `<div class="g-row"><div class="n"><b>${r[0]}</b><span>${r[1]}</span></div><div class="g-lane">${grid}${b}${`<span class="g-today" style="left:${gx(TODAY)}%"></span>`}</div></div>`;}).join('')}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function kiMsg(c){return {rate_limited:'Gerade zu viele Anfragen. Bitte gleich noch einmal versuchen.',session_expired:'Bitte neu anmelden, dann erneut versuchen.',image_rejected:'Dieses Bild kann nicht gelesen werden. Bitte ein JPG oder PNG wählen.',refused:'Die KI hat diese Eingabe abgelehnt. Bitte den Text anpassen.',invalid_json:'Die Antwort war unvollständig. Bitte noch einmal auslesen.',empty_completion:'Keine Antwort erhalten. Bitte noch einmal versuchen.',prompt_too_large:'Der Text ist zu lang. Bitte kürzen.'}[c]||'Verbindung zur KI unterbrochen. Bitte erneut versuchen.';}
const OFFLINE=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
async function kiRun(key,{prompt,json,tier,images,onText,fallback,minWait}){
  const st=S.ai[key];st.status='run';st.err=null;st.note=null;render();
  const demo=async(note)=>{await wait(minWait||1600);st.res=fallback();st.mode='demo';st.note=note||null;st.status='done';};
  if(!KI){await demo();render();return;}
  st.ctl=new AbortController();
  try{const o={modelTier:tier||'default',signal:st.ctl.signal};if(images)o.images=images;if(onText)o.onText=onText;
    st.res=json?await KI.json(prompt,o):(await KI(prompt,o)).text;st.mode='live';st.status='done';}
  catch(e){const c=e&&e.code;
    if(c==='cancelled'){st.status='idle';}
    else if(OFFLINE.includes(c)){KI=null;KIS.state='off';kiBadge();await demo('Ohne KI-Freigabe zeigt die Demo ein vorbereitetes Ergebnis.');}
    else if(c==='images_unavailable'){await demo('Bildprüfung ist in dieser Ansicht nicht verfügbar, gezeigt wird ein vorbereitetes Ergebnis.');}
    else{st.status='error';st.err=kiMsg(c);}}
  render();
}

function go(r){S.route=r;S.expand=null;if(r==='neu'&&!S.nw)initNew();render();window.scrollTo({top:0});}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-tid],[data-ttab],[data-ptab],[data-exp],[data-ask],[data-remind],[data-lf],[data-adv],[data-slot],[data-nstep]');if(!t)return;
  const d=t.dataset;if(t.tagName==='A')e.preventDefault();
  if(d.go){if(S.tour>=0)S.tour=-1;go(d.go);return;}
  if(d.tid){S.route='vergabe';S.tid=d.tid;S.ttab=TENDERS.find(x=>x.id===d.tid).bidders.some(b=>b.price)?'vergleich':'bieter';S.expand=null;render();return;}
  if(d.ttab){S.ttab=d.ttab;S.expand=null;render();return;}
  if(d.ptab){S.ptab=d.ptab;render();window.scrollTo({top:0});return;}
  if(d.exp!==undefined){S.expand=S.expand===+d.exp?null:+d.exp;render();return;}
  if(d.ask!==undefined){TENDERS.find(x=>x.id===S.tid).bidders[+d.ask].asked=true;S.expand=null;render();toast('Rückfrage versendet');return;}
  if(d.remind!==undefined){toast('Erinnerung an '+TENDERS.find(x=>x.id===S.tid).bidders[+d.remind].name+' versendet');return;}
  if(d.lf){S.lf=d.lf;render();return;}
  if(d.adv){const l=LEADS.find(x=>x.id===+d.adv);l.st++;l.next=['','Selbstauskunft prüfen','Besichtigung planen','Reservierung vorbereiten','Notartermin abstimmen'][l.st];render();return;}
  if(d.slot){S.qr.slot=d.slot;render();return;}
  if(d.nstep!==undefined){if(S.nw.sending<0){S.nw.step=+d.nstep;render();}return;}
  switch(d.act){
   case 'tour-start':tourGo(0);break;
   case 'tour-next':tourGo(S.tour+1);break;
   case 'tour-prev':tourGo(S.tour-1);break;
   case 'tour-end':S.tour=-1;render();break;
   case 'askall':{const tn=TENDERS.find(x=>x.id===S.tid);let n=0;tn.bidders.forEach(b=>{if((b.status==='angebot'||b.status==='unterlagen')&&missOf(b).length&&!b.asked){b.asked=true;n++;}});render();toast(n+' Rückfragen versendet');break;}
   case 'analyze':{S.ana='run';S.run=0;render();const step=()=>{S.run++;if(S.run<5){render();setTimeout(step,650);}else{S.ana='done';render();}};setTimeout(step,650);break;}
   case 'award':S.awarded=true;render();toast('Vergabe freigegeben und protokolliert');break;
   case 'nnext':S.nw.step++;render();break;
   case 'nback':S.nw.step--;render();break;
   case 'nsend':{const w=S.nw;w.sending=0;render();const tick=()=>{w.sending++;render();if(w.sending<4)setTimeout(tick,550);else setTimeout(()=>{const id='t'+(TENDERS.length+1);TENDERS.unshift({id,gewerk:w.gewerk,project:w.project.replace('Wohnquartier ','').replace(' · ',' '),lv:86,deadline:new Date(w.frist).toLocaleDateString('de-DE'),need:5,bidders:[...w.sel].map(i=>mk(POOL[i][0],POOL[i][1],null,[0,0,0,0,0,0],0,0,0,[],'eingeladen',''))});S.nw=null;S.tid=id;S.ttab='bieter';go('vergabe');toast(w.sel.size+' Einladungen versendet');},450);};setTimeout(tick,550);break;}
   case 'ist-':S.ist=Math.max(0,S.ist-1);$('#istOut').textContent=S.ist;break;
   case 'ist+':S.ist=Math.min(20,S.ist+1);$('#istOut').textContent=S.ist;break;
   case 'save':S.saved=true;S.assume=Math.max(1,Math.min(10,S.ist||1));render();toast(S.ist<10?'Gespeichert · Abweichung erkannt':'Tagesbericht gespeichert');break;
   case 'letter':S.letter='draft';S.ptab='schrift';render();window.scrollTo({top:0});break;
   case 'review':S.letter='review';render();toast('Zur Freigabe an Dennis gesendet');break;
   case 'backdraft':S.letter='draft';render();break;
   case 'send':S.letter='sent';render();toast('Freigegeben und versendet');break;
   case 'qrscan':S.qr.step=1;render();break;
   case 'qrreset':S.qr.step=0;S.qr.slot=null;render();break;
   case 'qrsend':{const id=Date.now();LEADS.unshift({id,n:S.qr.name.trim()||'Neuer Interessent',u:'Villaglück · WE 3',a:'Kauf',src:'Flyer-QR',st:S.qr.slot?2:0,next:S.qr.slot?'Besichtigung '+S.qr.slot:'Erstkontakt heute',score:'—'});S.newLead=id;S.qr.step=2;S.lf='alle';render();toast('Neuer Interessent in der Pipeline');break;}
   case 'noop':toast('In der Demo nicht ausgebaut');break;
  }
});

  }
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-askform]');if(!f)return;e.preventDefault();const q=$('#askQ').value.trim();if(!q)return;const i=ASKS.indexOf(q);runAsk(q,i<0?null:i);});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='offerTxt')S.ai.offer.txt=t.value;
  if(t.id==='leadTxt')S.ai.lead.txt=t.value;
  if(t.id==='askQ')S.ai.ask.q=t.value;
  if(t.dataset.qty!==undefined){const v=parseFloat(String(t.value).replace(/\./g,'').replace(',','.'));S.nw.lv[+t.dataset.qty][4]=isNaN(v)?null:v;}
  if(t.dataset.w){S.w[t.dataset.w]=+t.value;const y=scrollY;render();scrollTo(0,y);document.getElementById(t.id)?.focus();}
  if(t.hasAttribute('data-assume')){S.assume=+t.value;const y=scrollY;render();scrollTo(0,y);document.getElementById('as')?.focus();}
  if(t.dataset.qr)S.qr[t.dataset.qr]=t.value;
  if(t.dataset.pool){const i=+t.dataset.pool;t.checked?S.nw.sel.add(i):S.nw.sel.delete(i);}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.nw)S.nw[t.dataset.nw]=t.value;if(t.dataset.pool||t.dataset.qty!==undefined)render();
  if(t.dataset.lsel){S.ai.letter[t.dataset.lsel]=t.value;if(t.dataset.lsel==='anlass'){S.ai.letter.text='';S.ai.letter.mode=null;}render();}
  if(t.id==='docFile'&&t.files&&t.files[0])runDoc(t.files[0]);});
document.addEventListener('keydown',e=>{if(S.tour<0)return;if(e.key==='ArrowRight'&&S.tour<TOUR.length-1&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))tourGo(S.tour+1);if(e.key==='ArrowLeft'&&S.tour>0&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))tourGo(S.tour-1);if(e.key==='Escape'){S.tour=-1;render();}});
const h=location.hash.slice(1);if(['nu','auto','events','freigaben','cockpit','vergabe','portal','projekt','crm','objekt','kanaele'].includes(h))S.route=h;
render();
})();
</script>
