server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;

  # Nicht in Suchmaschinen, nicht einbettbar, kein Raten des Inhaltstyps.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Optionaler Passwortschutz: wird beim Start aus BASIC_AUTH_USER und
  # BASIC_AUTH_PASSWORD erzeugt (docker-entrypoint.d/40-basic-auth.sh).
  include /etc/nginx/auth.conf;

  # Für Coolify und andere Prüfungen, immer ohne Passwort.
  location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
